# badminton_vision — central configuration
# All tunable parameters live here.
# CLI flags and SLURM --export overrides take precedence at runtime.
# See utils/config_loader.py for load_config().

# ─── MOG2 ────────────────────────────────────────────────────────────────────
mog2_warmup_frames: 150           # frames before MOG2 filter is enabled
mog2_foreground_thresh_player: 0.06   # min foreground coverage in player bbox
mog2_foreground_thresh_shuttle: 0.0   # disabled — MOG2 too aggressive for shuttle;
                                      # rely on TrackNet conf_threshold alone
mog2_var_threshold: 200
mog2_history: 1000

# ─── TrackNet ────────────────────────────────────────────────────────────────
tracknet_buffer_size: 3
tracknet_box_size: 16
tracknet_expected_h: 288
tracknet_expected_w: 512
tracknet_conf_threshold: 0.0001      # was 0.001 — accept lower-confidence detections
tracknet_weights: models/tracknet.pt
# Batch N frames into one GPU forward pass for ~3–5× higher throughput.
# 8 is the standard default (SageMaker/Triton Inference Server) and fits
# any OSCAR GPU at 9×288×512×float32 input size.
tracknet_batch_size: 8

# ─── Hit detection ───────────────────────────────────────────────────────────
hit_trajectory_n: 6               # positions for quadratic fit (pre+post)
hit_cooldown_s: 0.2
hit_proximity_cm: 200.0           # max player-shuttle distance to attribute hit
hit_prediction_error_threshold: 20.0  # pixels; deviation above this = hit
hit_ransac_iterations: 10
hit_ransac_min_inliers: 3

# ─── Rally ───────────────────────────────────────────────────────────────────
rally_inactive_timeout_s: 1.0
rally_min_period_s: 0.5           # short inactive gaps below this merged into rally
rally_motion_required_streak: 2
rally_max_displacement_fraction: 0.1667  # 1/6 of max(frame_h, frame_w)
rally_min_displacement_px: 5.0
rally_stable_frame_threshold: 5
rally_min_duration_s: 0.1         # was 0.3 — accept very short rallies
rally_detection_grace_frames: 8   # was 5 — bridge more TrackNet miss frames
rally_min_hits: 0                 # was 1 — hit detection is separate; don't gate rallies on it

# ─── Player tracking ─────────────────────────────────────────────────────────
player_conf_threshold: 0.5
player_bytetrack_history: 1000
player_weights: models/yolo.pt             # fine-tuned; falls back to yolov8n.pt
# Run YOLO every N frames; return cached detections in between.
# ByteTrack's Kalman state persists across the gap (persist=True).
# N=3 → ~67% fewer YOLO calls; safe for badminton where players move
# ~5–15 cm/frame at court scale.  Set to 1 to disable interval gating.
player_detect_interval: 3

# ─── Court ───────────────────────────────────────────────────────────────────
court_real_width_cm: 610.0
court_real_length_cm: 1340.0
court_points_file: data/input/court_points.json

# ─── Stroke classifier ───────────────────────────────────────────────────────
stroke_pose_joints: 33
stroke_trajectory_n: 6
stroke_weights: models/stroke.pt
# Set to false to skip MediaPipe Pose init and model load during SLURM inference.
# Re-enable (true) for local post-processing runs where stroke labels are needed.
stroke_classify_enabled: false

# ─── Visualization ───────────────────────────────────────────────────────────
court_insert_h: 300
court_insert_alpha: 0.82
# heatmap_gaussian_sigma: Gaussian smoothing for the court heatmap.
#   Higher = softer, broader gradient (better for long rallies).
#   Lower  = tighter hotspot (better for short clips).
#   Kernel size is derived automatically as ceil(6*sigma)|1.
heatmap_gaussian_sigma: 25
player_heatmap_blur: 7        # legacy knob, superseded by heatmap_gaussian_sigma
player_stamp_radius: 6
player_p1_color_bgr: [57, 255, 20]   # neon green
player_p2_color_bgr: [0, 165, 255]   # orange

# ─── Training ────────────────────────────────────────────────────────────────
train_val_split: 0.8
train_iou_threshold: 0.5
train_epochs_tracknet: 50
train_epochs_yolo: 50
train_epochs_stroke: 30
train_batch_size: 16
train_learning_rate: 3.0e-4
train_min_lr: 1.0e-6
train_num_workers: 4
train_data_dir: data/input/train_mog_reflect
train_finebadminton_dir: data/input/finebadminton

# ─── Runtime ─────────────────────────────────────────────────────────────────
fps: 30.0
device: cpu       # overridden to cuda by SLURM jobs / auto-detected at startup
output_dir: data/output
