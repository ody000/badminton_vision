[project]
name = "badminton-vision"
version = "0.1.0"
description = "Badminton player/shuttle tracking and stroke classification pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # NOTE: torch and torchvision are intentionally excluded here.
    # Install them separately with the correct CUDA wheel for your machine:
    #
    #   OSCAR (check CUDA version with: nvcc --version or nvidia-smi):
    #     uv pip install torch torchvision --index-url https://download.pytorch.org/whl/cu121
    #
    #   Mac (CPU only):
    #     uv pip install torch torchvision
    #
    "numpy>=1.24.0",
    "opencv-python-headless>=4.8.0",
    # Detection / tracking
    "ultralytics>=8.0.0",          # YOLOv8
    "scipy>=1.11.0",
    # Pose / stroke classification
    "mediapipe>=0.10.0",
    # Dataset utilities
    "roboflow>=1.1.0",
    "huggingface-hub>=0.20.0",
    "datasets>=2.16.0",
    # Config / utilities
    "pyyaml>=6.0",
    "requests>=2.31.0",
    # Viewer
    "dearpygui>=1.11.0",
]
